name: Release CleanWrap

on:
  push:
    paths:
      - "release.json"

permissions:
  contents: write

jobs:
  release:
    name: Create CleanWrap Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      # ─────────────────────────────────────────────
      # Extract version
      # ─────────────────────────────────────────────

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' release.json)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version in release.json: $VERSION"
            echo "Expected format: 1.0.1"
            exit 1
          fi

          TAG="v$VERSION"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release tag: $TAG"
          echo "Release version: $VERSION"

      - name: Check existing release tag
        id: tag
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag already exists; release preparation will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ─────────────────────────────────────────────
      # Locate installer
      # ─────────────────────────────────────────────

      - name: Locate installer
        id: installer
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          INSTALLER="release/CleanWrap_v${{ steps.version.outputs.version }}.exe"

          if [ ! -f "$INSTALLER" ]; then
            echo "ERROR: Installer not found:"
            echo "$INSTALLER"
            echo ""
            echo "Contents of release/:"
            ls -lah release/ || true
            exit 1
          fi

          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"

          echo "Installer found:"
          ls -lh "$INSTALLER"

      # ─────────────────────────────────────────────
      # Locate release notes
      # ─────────────────────────────────────────────

      - name: Locate release notes
        id: notes
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          NOTES="docs/release_v${{ steps.version.outputs.version }}.md"

          if [ ! -f "$NOTES" ]; then
            echo "ERROR: Release notes not found:"
            echo "$NOTES"
            echo ""
            echo "Available release notes:"
            ls -lah docs/ || true
            exit 1
          fi

          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

          echo "Release notes found:"
          ls -lh "$NOTES"

      # ─────────────────────────────────────────────
      # Create GitHub Release
      # ─────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.exists != 'true'
        with:
          name: CleanWrap v${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}

          body_path: ${{ steps.notes.outputs.notes }}

          files: |
            ${{ steps.installer.outputs.installer }}

          fail_on_unmatched_files: true
