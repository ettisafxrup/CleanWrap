name: Release CleanWrap

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"

      - name: Find installer
        id: installer
        shell: bash
        run: |
          INSTALLER=$(find release -maxdepth 1 -type f -name "*.exe" | head -n 1)

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: No installer found in release/"
            exit 1
          fi

          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"

          echo "Found installer:"
          echo "$INSTALLER"

      - name: Calculate SHA-256
        id: hash
        shell: bash
        run: |
          HASH=$(sha256sum "${{ steps.installer.outputs.installer }}" | awk '{print $1}')

          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

          echo "SHA-256:"
          echo "$HASH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CleanWrap v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}

          body_path: release/README.md

          generate_release_notes: true

          files: |
            ${{ steps.installer.outputs.installer }}

          append_body: true

          body: |

            ---

            ## SHA-256

            ```
            ${{ steps.hash.outputs.sha256 }}
            ```
